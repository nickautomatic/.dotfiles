- name: Install Mitos
  tags: [ mitos ]
  become: true
  apt:
    deb: https://github.com/mitos-editor/mitos/releases/download/v0.1.3/mitos_0.1.3-1_amd64.deb
    state: present

- name: Symlink Mitos config file
  tags: [ mitos ]
  file:
    src: "~/.dotfiles/mitos"
    dest: "~/.config/mitos"
    state: link
    force: yes
